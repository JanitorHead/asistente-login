<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Entrar en la UCA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #fff);
    --fg: var(--tg-theme-text-color, #111);
    --muted: var(--tg-theme-hint-color, #888);
    --field: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-fg: var(--tg-theme-button-text-color, #fff);
    --error: var(--tg-theme-destructive-text-color, #d93025);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, system-ui, sans-serif;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; }
  input {
    width: 100%; font: inherit; color: var(--fg); background: var(--field);
    border: 0; border-radius: 12px; padding: 14px; margin: 0 0 16px;
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 12px;
    padding: 14px; background: var(--accent); color: var(--accent-fg); margin-top: 4px;
  }
  button:disabled { opacity: .6; }
  #estado { min-height: 1.4em; margin: 14px 4px 0; font-size: 14px; }
  #estado.error { color: var(--error); }
  .nota { color: var(--muted); font-size: 12px; margin: 28px 4px 0; }
</style>
</head>
<body>
<h1 id="titulo">Entrar en la UCA</h1>
<p class="sub" id="sub">Con tu usuario y contraseña de siempre (los del campus virtual).</p>
<form id="f" autocomplete="on">
  <label for="u" id="ul">Usuario</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="p">Contraseña</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Entrar</button>
</form>
<p id="estado" role="status"></p>
<p class="nota" id="nota">La contraseña viaja cifrada y solo tu asistente puede leerla. La usa una vez para entrar en la UCA y no la guarda.</p>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  const cfg = { n: q.get("n"), k: q.get("k"), s: q.get("s") || "uca" };
  const $ = (id) => document.getElementById(id);
  const estado = (txt, error = false) => { $("estado").textContent = txt; $("estado").className = error ? "error" : ""; };
  const guarda = "La contraseña viaja cifrada y solo tu asistente puede leerla. La guarda cifrada para entrar por ti.";
  const TEXTOS = {
    uca: null,
    r0: { titulo: "Entrar en R0 Prácticas", sub: "Con el usuario y la contraseña de R0 (no son los de la UCA).", ul: "Usuario", nota: guarda },
    remnote: { titulo: "Entrar en RemNote", sub: "Con el correo y la contraseña de tu cuenta de RemNote.", ul: "Correo", nota: guarda },
  };
  if (!(cfg.s in TEXTOS)) cfg.s = "uca";
  const t = TEXTOS[cfg.s];
  if (t) {
    document.title = t.titulo;
    for (const id of ["titulo", "sub", "ul", "nota"]) $(id).textContent = t[id];
    if (cfg.s === "remnote") { $("u").type = "email"; $("u").autocomplete = "email"; }
  }

  if (tg) { tg.ready(); tg.expand(); }
  $("u").value = q.get("u") || "";
  if (!tg || tg.platform === "unknown" || !cfg.n || !cfg.k) {
    $("b").disabled = true;
    estado(`Abre esta página desde el botón «${t ? t.titulo : "Entrar en la UCA"}» del bot.`, true);
    return;
  }

  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64url = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (ch) => ch.charCodeAt(0));

  async function seal(user, password) {
    const pub = await crypto.subtle.importKey("spki", unb64url(cfg.k), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    const aes = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const plain = new TextEncoder().encode(JSON.stringify({ n: cfg.n, s: cfg.s, u: user, pw: password }));
    const c = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, plain);
    const k = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pub, await crypto.subtle.exportKey("raw", aes));
    return JSON.stringify({ v: 1, k: b64(k), iv: b64(iv), c: b64(c) });
  }

  $("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("b").disabled = true;
    try {
      const payload = await seal($("u").value.trim(), $("p").value);
      $("p").value = "";
      estado("Enviado. Vuelve al chat: allí te digo si ha entrado.");
      tg.sendData(payload);
    } catch (e) {
      estado("No he podido preparar el envío. Prueba otra vez.", true);
      $("b").disabled = false;
    }
  });
})();
</script>
</body>
</html>
